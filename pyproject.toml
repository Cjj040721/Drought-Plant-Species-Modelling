[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drought-plant-species-modelling"
version = "1.0.0"
description = "Reproducible climate-driven plant-community simulation and uncertainty analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Junjia Cao"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "httpx>=0.27,<1",
]

[project.scripts]
drought-simulate = "drought_sim.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
